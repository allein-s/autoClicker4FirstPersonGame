[project]
name = "autoclicker"
version = "1.0.0"
description = "Windows auto-clicker that clicks at the cursor position on a looping schedule, toggled by a global hotkey."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# Code formatter (the "Prettier" for Python). Run `black .` to format.
[tool.black]
line-length = 100
target-version = ["py312"]
